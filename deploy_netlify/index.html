c và lập trường chính trị từ duy tâm sang duy vật."],"correct":1,"expl":""},{"id":180,"q":"Sự ra đời của chủ nghĩa xã hội khoa học dựa vào điều kiện nào?","options":["Điều kiện kinh tế, xã hội, khoa học tự nhiên.","Điều kiện kinh tế, xã hội, khoa học tự nhiên, tư tưởng lý luận.","Điều kiện xã hội, khoa học tự nhiên, tư tưởng lý luận.","Điều kiện kinh tế, xã hội, tư tưởng lý luận."],"correct":1,"expl":""},{"id":181,"q":"Chủ nghĩa xã hội khoa học là:","options":["Chủ nghĩa Mác – Lênin, luận giải từ các giác độ triết học, kinh tế học chính trị, chính trị xã hội từ sự chuyển biến tất yếu của xã hội loài người.","Một trong ba bộ phận hợp thành chủ nghĩa Mác – Lênin.","Những yếu tố từ đó nảy sinh ra chế độ tương lai.","Chủ nghĩa Mác – Lênin, luận giải từ các giác độ triết học, kinh tế học chính trị, chính trị xã hội từ sự chuyển biến tất yếu của xã hội loài người; một trong ba bộ phận hợp thành chủ nghĩa Mác – Lênin."],"correct":3,"expl":""},{"id":182,"q":"Cơ sở phương pháp luận cho các nhà sáng lập chủ nghĩa xã hội khoa học là:","options":["Học thuyết Tiến hoá; Định luật Neuton; Định luật Talet.","Học thuyết Tiến hoá; Định luật Neuton; Học thuyết tế bào.","Học thuyết Tiến hoá; Định luật Bảo toàn và chuyển hoá năng lượng; Học thuyết tế bào.","Học thuyết Tiến hoá; Định luật Neuton; Định luật Bảo toàn và chuyển hoá năng lượng."],"correct":2,"expl":""},{"id":183,"q":"Tiền đề tư tưởng lý luận cho sự ra đời của chủ nghĩa xã hội khoa học là:","options":["Triết học cổ điển Đức; Kinh tế chính trị học cổ điển Anh; Chủ nghĩa không tưởng phê phán.","Triết học cổ điển Anh; Kinh tế chính trị học cổ điển Anh; Chủ nghĩa phê phán.","Triết học cổ điển Pháp; Kinh tế chính trị học cổ điển Anh; Chủ nghĩa không tưởng phê phán.","Triết học Mác - Lênin; Kinh tế chính trị học cổ điển Anh; Chủ nghĩa không tưởng phê phán."],"correct":0,"expl":""},{"id":184,"q":"Chọn đáp án KHÔNG đúng. Ưu điểm của chủ nghĩa xã hội không tưởng là:","options":["Thể hiện tinh thần phê phán, lên án chế độ quân chủ chuyên chế và chế độ TBCN bất công.","Đưa ra nhiều luận điểm có giá trị về xã hội tương lai; về tổ chức sản xuất, phân phối; vai trò của khoa học, công nghệ; giải phóng lao động, giải phóng phụ nữ.","Thức tỉnh giai cấp công nhân và người lao động trong cuộc đấu tranh chống chế độ quân chủ chuyên chế và chế độ TBCN bất công.","Giúp chủ nghĩa tư bản chuyển từ tự do cạnh tranh sang độc quyền, chuẩn bị nền tảng kinh tế, xã hội cho giai cấp công nhân."],"correct":3,"expl":""},{"id":185,"q":"Trong tác phẩm nào sau đây phản ánh hạn chế của chủ nghĩa xã hội không tưởng:","options":["Tuyên ngôn Đảng Cộng sản – Mác, Ăngghen.","Ba nguồn gốc, ba bộ phận hợp thành chủ nghĩa Mác – V.I.Lênin.","Chống Đuyrinh – Ph. Ăngghen.","Làm gì? - V.I.Lênin."],"correct":1,"expl":""},{"id":186,"q":"Phát kiến vĩ đại nào của Ph. Ăngghen và","options":["Mác để khắc phục hạn chế của chủ nghĩa xã hội không tưởng?","Chủ nghĩa duy vật lịch sử.","Học thuyết về giá trị thặng dư.","Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân.","Chủ nghĩa duy vật biện chứng."],"correct":3,"expl":""},{"id":187,"q":"“Sự diệt vong không tránh khỏi của CNTB và sự thắng lợi tất yếu của CNXH” là luận chứng và khẳng định về phương diện chính trị – xã hội của:","options":["Học thuyết về giá trị thặng dư.","Chủ nghĩa duy vật lịch sử.","Chủ nghĩa duy vật biện chứng.","Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân."],"correct":3,"expl":""},{"id":188,"q":"Tác phẩm kinh điển chủ yếu của chủ nghĩa xã hội khoa học là:","options":["Tuyên ngôn của Đảng Cộng sản.","Tuyên ngôn Đảng Cộng sản Việt Nam.","Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân.","Học thuyết về giá trị thặng dư."],"correct":0,"expl":""},{"id":189,"q":"Luận điểm nào sau đây không thuộc chủ nghĩa xã hội khoa học:","options":["Logic phát triển tất yếu của xã hội là sự sụp đổ của của CNTB và sự thắng lợi của CNXH.","Tính tất yếu của xã hội loài người là phải trải qua giai đoạn CNTB đi lên CNCS.","Giai cấp công nhân là đội tiên phong xây dựng CNXH, có sứ mệnh thủ tiêu CNTB.","Người cộng sản trên thế giới đoàn kết lại, liên minh lực lượng dân chủ đánh đổ chế độ phong kiến và TBCN. Tiến hành cuộc cách mạng không ngừng, có chiến lược, sách lược khôn khéo và kiên quyết."],"correct":1,"expl":""},{"id":190,"q":"Tác phẩm chủ yếu và cơ bản trình bày chủ nghĩa xã hội khoa học là:","options":["Chống Đuyrinh – Ph. Ăngghen.","Làm gì? - V.I.Lênin.","Bộ Tư bản – C.Mác.","Tình cảnh nước Anh – Ph. Ăngghen."],"correct":2,"expl":""},{"id":191,"q":"Các tôn giáo hiện nay ở Việt Nam hoạt động:","options":["Không cần dựa trên quy chuẩn pháp luật.","Không cần dựa trên quy chuẩn đạo đức.","Đan xen, hỗ trợ với nhau cùng phát triển.","Bình đẳng trong khuôn khổ pháp luật."],"correct":3,"expl":""},{"id":192,"q":"Để thực hiện được quyền bình đẳng dân tộc, trước hết:","options":["Phải thủ tiêu giai cấp tư sản.","Phải thủ tiêu tình trạng áp bức giai cấp.","Phải thủ tiêu nhà nước tư sản.","Phải thủ tiêu bất bình đẳng giữa các dân tộc."],"correct":1,"expl":""},{"id":193,"q":"Dựa trên cơ sở tổng kết kinh nghiệm cuộc cách mạng trong giai đoạn nào của giai cấp công nhân, Ph.Ăngghen và C.Mác tiếp tục phát triển nội dung của chủ nghĩa xã hội khoa học?","options":["Từ năm 1948 đến 1952.","Từ năm 1748 đến 1752.","Từ năm 1850 đến 1852.","Từ năm 1848 đến 1852."],"correct":3,"expl":""},{"id":194,"q":"Nội dung nào sau đây thuộc nội dung bổ sung của Ph. Ăngghen và C.Mác vào chủ nghĩa xã hội khoa học thời kì sau Công xã Pari đến 1895?","options":["Tư tưởng xoá bỏ quan hệ sản xuất tư bản, xây dựng quan hệ sản xuất XHCN.","Tư tưởng đập tan nhà nước tư sản, thiết lập chuyên chính vô sản.","Tư tưởng sự kết hợp đấu tranh giai cấp vô sản với phong trào đấu tranh của nông dân."],"correct":0,"expl":""},{"id":195,"q":"Theo quan điểm của các nhà sáng lập chủ nghĩa xã hội khoa học, cách mạng vô sản là cuộc cách mạng của:","options":["Giai cấp tư sản tiến bộ lãnh đạo, cùng với tầng lớp trí thức có tư tưởng tiến bộ, hoà bình.","Giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản.","Giai cấp vô sản, tầng lớp tri thức và nhân dân lao động trong xã hội tư bản.","Liên minh giai cấp công nhân – nông dân với các tầng lớp lao động trong xã hội tư bản."],"correct":1,"expl":""},{"id":196,"q":"Tác phẩm nào của Ph. Ăngghen đã luận chứng sự phát triển của chủ nghĩa xã hội từ không tưởng đến khoa học?","options":["Gia đình thánh.","Hệ tư tưởng Đức.","Chống Đuyrinh.","Tuyên ngôn Đảng Cộng sản."],"correct":2,"expl":""},{"id":197,"q":"Quan điểm nào sau đây là sự vận dụng sáng tạo nguyên lý cơ bản của chủ nghĩa xã hội khoa học của Lênin?","options":["Cách mạng giải phóng dân tộc bản thân nó được giải quyết trong cách mạng vô sản.","Cách mạng vô sản có thể nổ ra và thắng lợi một số nước, nơi CNTB chưa phải phát triển nhất.","Cách mạng giải phóng dân tộc có khản năng nổ ra và giành thắng lợi trước cách mạng vô sản.","Cách mạng giải phóng dân tộc phụ thuộc vào cách mạng vô sản ở chính quốc."],"correct":1,"expl":""},{"id":198,"q":"Luận điểm nào sau đây không phải do V.I.Lênin viết bàn về những nguyên lý của chủ nghĩa xã hội khoa học trong thời kỳ mới?","options":["Về chuyên chính vô sản; Thời kỳ quá độ chính trị từ CNTB lên CNCS.","Về chế độ dân chủ: không có dân chủ thuần tuý hay dân chủ nói chung.","Về thời kỳ quá độ chính trị từ các nước không qua giai đoạn tư bản tiến lên CNXH.","Về cải cách hành chính bộ máy nhà nước và cương lĩnh xây dựng CNXH ở Nga."],"correct":2,"expl":""},{"id":199,"q":"“Thời đoạn Xtalin” trực tiếp vận dụng và phát triển chủ nghĩa xã hội khoa học là:","options":["Từ năm 1917 đến 1920.","Từ năm 1920 đến 1924.","Từ năm 1945 đến 1953.","Từ năm 1924 đến 1953."],"correct":3,"expl":""},{"id":200,"q":"Giai cấp công nhân Việt Nam ra đời vào thời gian nào? Chọn đáp án đúng nhất.","options":["Trước giai cấp tư sản Pháp vào đầu thế kỷ XIX.","Trước giai cấp tư sản Việt Nam vào đầu thế kỷ XX.","Trước giai cấp tư sản Pháp vào đầu thế kỷ XX.","Trước giai cấp tư sản Việt Nam vào đầu thế kỷ XXI."],"correct":1,"expl":""},{"id":201,"q":"Hội nghị đại biểu các Đảng Cộng sản và công nhân quốc tế họp tại Matxcova (11- 1957) đã tổng kết thông qua mấy qui luật chung của công cuộc cải tạo và xây dựng CNXH?","options":["6 qui luật chung.","7 qui luật chung.","8 qui luật chung.","9 qui luật chung."],"correct":3,"expl":""},{"id":202,"q":"Nhiệm vụ vô cùng quan trọng của chủ nghĩa xã hội khoa học là:","options":["Chống CNTB, bảo vệ CNXH.","Phê phán đấu tranh bác bỏ tư tưởng chống cộng, chống CNXH, bảo vệ thành quả cách mạng XHCN.","Phê phán, bác bỏ tư tưởng chống chủ nghĩa đế quốc, bảo vệ thành quả cách mạng tư sản.","Chống CNTB, chống chế độ Phong kiến, bảo vệ thành quả cách mạng XHCN."],"correct":1,"expl":""},{"id":203,"q":"C.Mác và Ph.Ăngghen đã sử dụng thuật ngữ nào sau đây để chỉ về giai cấp công nhân? Chọn đáp án KHÔNG đúng. C.Mác và Ph.Ăngghen để chỉ về giai cấp công nhân đã dùng thuật ngữ:","options":["Giai cấp vô sản.","Giai cấp vô sản hiện đại.","Giai cấp công nhân đại công nghiệp.","Tầng lớp công nhân."],"correct":2,"expl":""},{"id":204,"q":"Con đẻ của nền đại công nghiệp tư bản chủ nghĩa là:","options":["Giai cấp công nhân.","Giai cấp vô sản.","Giai cấp vô sản hiện đại."],"correct":0,"expl":""},{"id":205,"q":"Giai cấp công nhân được các nhà kinh điển xác định trên phương diện cơ bản nào?","options":["Kinh tế – xã hội và chính trị – ngoại giao.","Kinh tế – xã hội và chính trị – xã hội.","Kinh tế – văn hoá và chính trị – xã hội.","Kinh tế – ngoại giao và chính trị – quân sự."],"correct":1,"expl":""},{"id":206,"q":"Chọn đáp án KHÔNG đúng. Chức năng cơ bản của gia đình:","options":["Tái sản xuất ra con người và nuôi dưỡng, giáo dục con người.","Kinh tế và tổ chức tiêu dùng.","Thoả mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đình.","Giúp tổ chức xã hội được tốt hơn."],"correct":3,"expl":""},{"id":207,"q":"Mâu thuẫn thể hiện tính chất đối kháng không thể điều hoà giữa giai cấp công nhân và giai cấp tư sản:","options":["Mâu thuẫn về lợi ích kinh tế.","Mâu thuẫn về lợi ích chính trị.","Mâu thuẫn về chế độ tư hữu về tư liệu sản xuất.","Mâu thuẫn giữa lực lượng sản xuất xã hội hoá ngày càng rộng lớn với quan hệ sản xuất TBCN."],"correct":3,"expl":""},{"id":208,"q":"Sự phát triển của giai cấp công nhân được qui định bởi:","options":["Sự phát triển của giai cấp tư sản công nghiệp.","Sự phát triển của giai cấp vô sản đại công nghiệp.","Sự phát triển của phong trào công nhân quốc tế.","Sự phát triển của chủ nghĩa đế quốc."],"correct":0,"expl":""},{"id":209,"q":"Chọn phương án đúng nhất theo Mác và Ăngghen đặc điểm nổi bật của giai cấp công nhân (giai cấp vô sản) là:","options":["Giai cấp bị áp bức bóc lột nặng nề.","Giai cấp lao động bằng phương thức công nghiệp với đặc trưng công cụ lao động là máy móc.","Giai cấp có phương thức sản xuất hiện đại.","Giai cấp có lý luận, lập trường vô sản."],"correct":1,"expl":""},{"id":210,"q":"Theo Mác và Ăngghen giai cấp công nhân đại biểu cho, chọn phương án đúng nhất:","options":["Phương thức sản xuất hiện đại.","Ý chí đấu tranh của giai cấp vô sản.","Lực lượng, phương thức sản xuất tiên tiến, quyết định sự tồn tại và phát triển của xã hội hiện đại.","Tinh thần cách mạng triệt để."],"correct":2,"expl":""},{"id":211,"q":"Mục tiêu cách mạng mà Đảng và nhân dân ta đang ra sức phấn đầu xây dựng là:","options":["Chủ nghĩa quốc tế.","Chủ nghĩa xã hội.","Chủ nghĩa tư bản.","Chủ nghĩa vô sản."],"correct":1,"expl":""},{"id":212,"q":"Phát kiến vĩ đại của Mác và Ăngghen cho tiền đề lý luận chủ nghĩa xã hội khoa học là:","options":["Chủ nghĩa duy vật lịch sử; Học thuyết giá trị thặng dư.","Chủ nghĩa duy vật lịch sử; Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp Công nhân.","Chủ nghĩa duy vật lịch sử; Học thuyết giá trị thặng dư; Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp Công nhân.","Chủ nghĩa duy vật lịch sử; Học thuyết các hình thái kinh tế xã hội; Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp Công nhân."],"correct":2,"expl":""},{"id":213,"q":"Nội dung nào là đặc trưng cơ bản về chính trị của chủ nghĩa xã hội ở nước ta?","options":["Là một xã hôi dân giàu, nước mạnh, dân chủ, công bằng, văn minh.","Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc.","Con người được giải phóng khỏi áp bức, bất công.","Do dân lao động làm chủ."],"correct":3,"expl":""},{"id":214,"q":"Điền vào chổ trống. “Bên cạnh những dấu vết của xã hội cũ, xuất hiện những yếu tố của xã hội mới, do vậy tất yếu sẽ diễn ra sự tồn tại […] giữa những giai cấp, tầng lớp cũ và mới”.","options":["Song song.","Đan xen.","Kết hợp.","Thay thế."],"correct":1,"expl":""},{"id":215,"q":"Chủ nghĩa xã hội mà nước ta đang xây dựng là một xã hội phát triển:","options":["Ưu việt hơn các xã hội trước.","Lợi thế hơn các xã hội trước.","Nhanh chóng.","Tự do."],"correct":0,"expl":""},{"id":216,"q":"Một trong những đặc trưng cơ bản của chủ nghĩa xã hội ở Việt Nam là:","options":["Có nền văn hóa tiến bộ, đậm đà bản sắc dân tộc.","Có nền văn hóa hiện đại.","Có di sản văn hóa vật thể và phi vật thể.","Có nguồn lao động dồn dào."],"correct":0,"expl":""},{"id":217,"q":"Sự kiện nào đánh dấu chủ nghĩa xã hội khoa học từ lý luận thành thực tiễn?","options":["Nhà nước Xô viết, năm 1917.","Cách mạng Tháng 10 Nga, năm 1917.","Cách mạng vô sản Pháp.","Nhà nước Công xã Pari."],"correct":0,"expl":""},{"id":218,"q":"Nguyên nhân nào lí giải cho việc nước ta đi lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa là hoàn toàn đúng đắn?","options":["Đi lên chủ nghĩa xã hội xóa bỏ áp bức, bóc lột.","Đi lên chủ nghĩa xã hội la nhu cầu của nhiều nước trên thế giới.","Tư bản chủ nghĩa là một chế độ còn duy trì tình trạng bóc lột.","Chủ nghĩa xã hội là chế độ xã hội tốt đẹp và công bằng."],"correct":0,"expl":""},{"id":219,"q":"Nền dân chủ xã hội chủ nghĩa là nền dân chủ:","options":["Của tất cả mọi người trong xã hội.","Của những người lãnh đạo.","Của nhân dân lao động.","Của giai cấp công nhân."],"correct":2,"expl":""},{"id":220,"q":"Các nhà sáng lập chủ nghĩa xã hội khoa học đã thừa nhận chủ nghĩa cộng sản ra đời dựa trên vai trò to lớn của:","options":["C.Mác và Ph.Ăngghen.","C.Mác, Ph.Ăngghen và V.I. Lênin.","Chủ nghĩa tư bản.","V.I.Lênin và cách mạng tháng 10/1917 – Nga."],"correct":2,"expl":""},{"id":221,"q":"Dân chủ xã hội chủ nghĩa là nền dân chủ:","options":["Tuyệt đối nhất.","Hoàn bị nhất.","Rộng rãi nhất và triệt để nhất.","Phổ biến nhất trong lịch sử."],"correct":2,"expl":""},{"id":222,"q":"Một trong những nội dung của dân chủ trong lĩnh vực chính trị được thể hiện ở:","options":["Quyền bình đẳng nam nữ.","Quyền tham gia quản lí nhà nước và xã hội.","Quyền tự do kinh doanh.","Quyền tự do lựa chọn nơi ở và làm việc."],"correct":1,"expl":""},{"id":223,"q":"Giai cấp công nhân hiện nay và giai cấp công nhân truyền thống ở thế kỷ XIX:","options":["Hoàn toàn tương đồng về bản chất và hình thức biểu hiện.","Vừa có điểm tương đồng vừa có điểm khác biệt.","Hoàn toàn khác biệt về bản chất và hình thức biểu hiện.","Tương đồng về bản chất, khác biệt về hình thức."],"correct":1,"expl":""},{"id":224,"q":"Quyền nào sau đây là một trong những nội dung của dân chủ trong lĩnh vực chính trị ?","options":["Quyền sáng tác văn học.","Quyền tự do báo chí.","Quyền lao động.","Quyền bình đẳng nam nữ."],"correct":1,"expl":""},{"id":225,"q":"Chế độ dân chủ XHCN ở Việt Nam được xác lập từ thời điểm nào?","options":["Sau Cách mạng tháng Tám năm 1945.","Sau Cách mạng tháng Tư năm 1975.","Từ năm 1976, khi đổi tên nước thành Cộng hoà xã hội chủ nghĩa Việt Nam.","Từ Đại hội VI của Đảng năm 1986."],"correct":0,"expl":""},{"id":226,"q":"Quyền nào thể hiện dân chủ trong lĩnh vực văn hóa?","options":["Quyền được đảm bảo về mặt tinh thần khi không còn khả năng lao động.","Quyền tham gia thảo luận các vấn đề chung của cả nước.","Quyền được thông tin, tự do ngôn luận, tự do báo chí.","Quyền được hưởng lợi ích từ sáng tạo nghệ thuật của mình."],"correct":3,"expl":""},{"id":227,"q":"Nước ta quá độ lên chủ nghĩa xã hội theo hình thức nào dưới đây?","options":["Quá độ trực tiếp.","Quá độ gián n, trí tuệ, di truyền.","Thể chất, tinh thần, nghề nghiệp.","Thể chất, trí tuệ, tinh thần."],"correct":3,"expl":""},{"id":240,"q":"Chọn đáp án đúng nhất, giai cấp công nhân chỉ có thể giải phóng mình thông qua việc:","options":["Thực hiện cách mạng bạo lực.","Thực hiện đấu tranh bạo lực giai cấp.","Đồng thời giải phóng các giai cấp bị áp bức bóc lột khác, giải phóng xã hội, giải phóng con người.","Giải phóng giai cấp nông dân, giai cấp vô sản bần cùng thông qua hình thức bạo lực giành chính quyền."],"correct":2,"expl":""},{"id":241,"q":"Mục tiêu phân bố dân cư hợp lí của chính sách dân số nước ta để:","options":["Giảm sự chênh lệch lao động giữa các vùng.","Khai thác tiềm năng và phát huy thế mạnh của từng vùng, miền.","Hạn chế tập trung đông dân cư vào đô thị lớn.","Giảm lao động thừa ở thành thị."],"correct":1,"expl":""},{"id":242,"q":"Chọn đáp án KHÔNG đúng. Dân tộc Việt Nam hiện nay có đặc điểm nổi bật:","options":["Các dân tộc ở Việt Nam có trình độ phát triển không đều.","Các dân tộc Việt Nam có truyền thống đoàn kết gắn bó lâu đời trong cộng đồng dân tộc – quốc gia thống nhất.","Các dân tộc cư trú theo từng vùng lãnh thổ riêng biệt, dân tộc thiểu số sống chủ yếu ở vùng đồi núi.","Mỗi dân tộc có bản sắc văn hoá riêng, góp phần tạo nên sự phong phú đa dạng của nền văn hoá Việt Nam thống nhất."],"correct":2,"expl":""},{"id":243,"q":"Quan niệm dân gian nào ảnh hưởng xấu đến chính sách dân số của Nhà nước?","options":["Cơn hơn cha là nhà có phước.","Một giọt máu đào hơn ao nước lã.","Cha mẹ sinh con trời sinh tính.","Đông con hơn nhiều của."],"correct":3,"expl":""},{"id":244,"q":"Theo Ph.Ăngghen, với tư cách là một hình thái nhà nước, một chế độ chính trị thì trong lịch sử nhân loại, cho đến nay có mấy chế độ dân chủ ra đời?","options":["2 (dân chủ tư sản; dân chủ XHCN).","3 (dân chủ nguyên thuỷ; dân chủ tư sản; dân chủ XHCN).","4 (dân chủ nguyên thuỷ; dân chủ chủ nô; dân chủ tư sản; dân chủ XHCN).","3 ( dân chủ chủ nô, dân chủ tư sản, dân chủ CNXH)"],"correct":3,"expl":""},{"id":245,"q":"Biện pháp nào sau đây là thực hiện chính sách giải quyết việc làm?","options":["Mở rộng các hình tức trợ giúp người nghèo.","Mở rộng hệ thống trường lớp.","Bồi dưỡng đội ngũ cán bộ quản lí.","Nâng cao trình độ người lao động."],"correct":3,"expl":""},{"id":246,"q":"Nội dung sứ mệnh lịch sử của giai cấp công nhân được thể hiện trong lĩnh vực:","options":["Kinh tế, chính trị, xã hội, văn hoá, tư tưởng.","Kinh tế, quân sự, chính trị, văn hoá, xã hội.","Xã hội, quân sự, chính trị, ngoại giao, kinh tế.","Ngoại giao, chính trị, xã hội, văn hoá, kinh tế."],"correct":0,"expl":""},{"id":247,"q":"Chọn đáp án KHÔNG đúng. Phân loại cơ cấu xã hội:","options":["Cơ cấu xã hội – dân cư, dân tộc, tôn giáo.","Cơ cấu xã hội – nghề nghiệp.","Cơ cấu xã hội – giai cấp.","Cơ cấu xã hội – lao động."],"correct":3,"expl":""},{"id":248,"q":"Căn cứ vào phạm vi tác động của quyền lực nhà nước, chức năng Nhà nước xã hội chủ nghĩa được chia thành:","options":["Chức năng đối nội, chức năng đối ngoại.","Chức năng kinh tế, chức năng chính trị.","Chức năng giai cấp, chức năng xã hội.","Chức năng đối nội, chức năng chính trị."],"correct":0,"expl":""}];

const LB = ['A','B','C','D','E'];
let cfg={n:10, order: 'shuffle'}; // 'shuffle' or 'sequential'
let ses={qs:[],idx:0,ok:0,no:0,ans:[],t0:0,mode:'random'};
let st=JSON.parse(localStorage.getItem('cnxh_v2')||'{"done":0,"best":null,"learned":[],"wrongs":[]}');

function save() { localStorage.setItem('cnxh_v2', JSON.stringify(st)); }
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));document.getElementById(id).classList.add('on'); window.scrollTo(0,0);}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}

function markLearned(id) {
    if(!st.learned.includes(id)) {
        st.learned.push(id);
        save();
    }
}
function markWrong(id) {
    if(!st.wrongs.includes(id)) {
        st.wrongs.push(id);
        save();
    }
}
function removeWrong(id) {
    st.wrongs = st.wrongs.filter(x => x !== id);
    save();
}

function updSt(){
  document.getElementById('sDone').textContent=st.done;
  document.getElementById('sBest').textContent=st.best?st.best+'%':'—';
  
  st.wrongs = st.wrongs.filter(id => Q.some(q => q.id === id));
  
  document.getElementById('sWrongs').textContent=st.wrongs.length;
  
  const pct = Math.round((st.learned.length / Q.length) * 100) || 0;
  document.getElementById('lbLearned').textContent = st.learned.length + ' / ' + Q.length;
  document.getElementById('fillLearned').style.width = pct + '%';
  
  const bLearn = document.getElementById('btnLearnNew');
  if(st.learned.length >= Q.length){
      bLearn.innerHTML = "🎉 Đã học hết toàn bộ!";
      bLearn.className = "btn ghost";
  } else {
      bLearn.innerHTML = "📚 Học tiếp " + (Q.length - st.learned.length) + " câu chưa biết";
      bLearn.className = "btn success";
  }
}
updSt();

document.querySelectorAll('#learnOrderToggle .toggle-btn').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('#learnOrderToggle .toggle-btn').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');
    cfg.order = b.dataset.v;
}));

document.querySelectorAll('#mrN .pill').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#mrN .pill').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel');cfg.n=+b.dataset.v;
}));

document.getElementById('btnStartRandom').addEventListener('click',()=>{
  ses.mode = 'random';
  let pool = cfg.order === 'shuffle' ? shuffle(Q) : [...Q];
  startSession(Math.min(cfg.n, pool.length), pool);
});

document.getElementById('btnLearnNew').addEventListener('click',()=>{
  if(st.learned.length >= Q.length) return alert("Bạn đã học hết toàn bộ câu hỏi!");
  ses.mode = 'learn';
  let unlearned = Q.filter(q => !st.learned.includes(q.id));
  let pool = cfg.order === 'shuffle' ? shuffle(unlearned) : [...unlearned];
  // Sort sequentially if option chosen, although unlearned is already sequential
  if(cfg.order === 'sequential') pool.sort((a,b)=>a.id - b.id);
  
  startSession(Math.min(20, pool.length), pool); 
});

document.getElementById('btnLearnWrongs').addEventListener('click',()=>{
  if(st.wrongs.length === 0) return alert("Bạn không có câu sai nào cần ôn tập!");
  ses.mode = 'review_wrongs';
  let wrongQs = Q.filter(q => st.wrongs.includes(q.id));
  let pool = cfg.order === 'shuffle' ? shuffle(wrongQs) : [...wrongQs];
  if(cfg.order === 'sequential') pool.sort((a,b)=>a.id - b.id);
  startSession(pool.length, pool); 
});

function startSession(n, pool) {
  ses.qs=pool.slice(0,n);
  ses.idx=0;ses.ok=0;ses.no=0;ses.ans=[];ses.t0=Date.now();
  show('quiz');renderQ();
}

function renderQ(){
  const q=ses.qs[ses.idx],tot=ses.qs.length,pct=Math.round(ses.idx/tot*100);
  document.getElementById('progTxt').textContent='Câu '+(ses.idx+1)+' / '+tot;
  document.getElementById('scoreTxt').textContent=ses.ok+' đúng';
  document.getElementById('wrongTxt').textContent=ses.no+' sai';
  
  document.getElementById('pFill').style.width=pct+'%';
  document.getElementById('qN').textContent='Câu ' + q.id;
  document.getElementById('qT').textContent=q.q;
  document.getElementById('exB').classList.remove('show');
  
  const nxt=document.getElementById('btnNxt');nxt.classList.remove('show');
  const wrap=document.getElementById('optsW');wrap.innerHTML='';
  
  q.options.forEach((o,i)=>{
    const b=document.createElement('button');b.className='opt';
    b.innerHTML='<span class="olbl">'+LB[i]+'</span><span class="otxt">'+o+'</span>';
    b.addEventListener('click',()=>pick(i,b,q));
    wrap.appendChild(b);
  });
}

function pick(i,btn,q){
  const opts=document.querySelectorAll('.opt');
  if(opts[0].classList.contains('lk'))return;
  opts.forEach(o=>o.classList.add('lk'));
  const isOk=i===q.correct;
  
  if(isOk){
      ses.ok++;
      btn.classList.add('ok');
      markLearned(q.id); 
      removeWrong(q.id); 
  }
  else{
      ses.no++;
      btn.classList.add('no');
      opts[q.correct].classList.add('sc');
      markWrong(q.id); 
  }
  
  ses.ans.push({q:q.q,opts:q.options,cor:q.correct,cho:i, expl:q.expl, id: q.id});
  
  const ex=document.getElementById('exB');
  let explHtml = '<div class="ex-title">' + (isOk ? '✨ Chính xác!' : '❌ Sai rồi!') + ' Đáp án đúng là '+LB[q.correct]+'.</div>';
  if(q.expl) explHtml += '<div class="ex-text" style="margin-top:6px;font-size:13.5px; opacity:0.9">' + q.expl + '</div>';
  
  ex.innerHTML = explHtml;
  ex.style.cssText='background:'+(isOk?'#E1F5EE':'#FCEBEB')+';border-left-color:'+(isOk?'#1D9E75':'#E24B4A')+';color:'+(isOk?'#0F6E56':'#A32D2D');
  ex.classList.add('show');
  document.getElementById('btnNxt').classList.add('show');
  updSt();
}

document.getElementById('btnNxt').addEventListener('click',()=>{
    ses.idx++;
    if(ses.idx>=ses.qs.length)showRes();
    else renderQ();
});

document.getElementById('btnQuit').addEventListener('click',()=>{
    showRes();
});

function showRes(){
  if(ses.idx === 0) {
      show('home');
      return; 
  }
  const tot=ses.idx, pct=Math.round(ses.ok/tot*100), el=Math.round((Date.now()-ses.t0)/1000);
  
  if(ses.mode === 'random' && tot >= 10) {
      st.done++;
      if(!st.best||pct>st.best)st.best=pct;
  }
  localStorage.setItem('cnxh_v2',JSON.stringify(st));updSt();
  
  const c=document.getElementById('rCircle');
  c.className='rcircle '+(pct>=80?'gr':pct>=50?'md':'bd');
  document.getElementById('rPct').textContent=pct+'%';
  document.getElementById('rTitle').textContent=pct>=80?'Xuất sắc!':pct>=50?'Khá tốt!':'Cố gắng hơn!';
  document.getElementById('rMsg').textContent=pct>=80?'Bạn nắm vững kiến thức rất tốt!':pct>=50?'Cần ôn tập thêm những câu sai nhé!':'Hãy đọc kỹ lại lý thuyết và làm lại!';
  
  document.getElementById('rsC').textContent=ses.ok;
  document.getElementById('rsW').textContent=ses.no;
  document.getElementById('rsT').textContent=tot;
  document.getElementById('rsTm').textContent=fmt(el);
  show('result');
}

document.getElementById('btnRev').addEventListener('click',showRev);
document.getElementById('btnRet').addEventListener('click',()=>{
    startSession(ses.qs.length, ses.qs);
});
document.getElementById('btnHom').addEventListener('click',()=>show('home'));

function showRev(){
  const wr=ses.ans.filter(a=>a.cho!==a.cor);
  const body=document.getElementById('rvBody');body.innerHTML='';
  if(!wr.length){
      body.innerHTML='<p style="text-align:center;color:#1D9E75;font-weight:600;padding:40px 10px; font-size:16px;">Bạn không trả lời sai câu nào! Khá khen!</p>';
      show('review');
      return;
  }
  body.innerHTML='<p style="font-size:14px;font-weight:600;color:var(--color-text-secondary);margin-bottom:12px">ÔN LẠI '+wr.length+' CÂU SAU ĐÂY:</p>';
  wr.forEach((a,i)=>{
    const d=document.createElement('div');d.className='rvi';
    let op='';
    a.opts.forEach((o,j)=>{
      const cl=j===a.cor?'c':j===a.cho?'w':'';
      if(cl)op+='<div class="rvop '+cl+'"><span class="ol">'+LB[j]+'.</span><span>'+o+'</span></div>';
    });
    
    let expl = a.expl ? '<div style="margin-top:10px; padding:10px; background:#f8fafc; border-radius:6px; font-size:13px; color:#475569; border: 1px solid #e2e8f0;"><b>Giải thích:</b> ' + a.expl + '</div>' : '';
    
    d.innerHTML='<div class="qn" style="color:#378add">Câu '+a.id+'</div><div class="qt" style="margin-bottom:12px; font-size: 15px;">'+a.q+'</div>'+op+expl;
    body.appendChild(d);
  });
  show('review');
}
document.getElementById('btnBackRev').addEventListener('click',()=>show('result'));
</script>
</body>
</html>
