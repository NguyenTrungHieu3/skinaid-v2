# Docker Compose for Production - Pull images from Docker Hub
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  database-postgresql:
    container_name: skinaid_postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - skinaid_net

  backend:
    container_name: skinaid_backend
    image: nguyentrunghieu123/skinaid-backend:latest
    restart: unless-stopped
    environment:
      # Database
      - DATABASE_URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@database-postgresql:5432/${DB_NAME}
      
      # JWT & Security
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Email
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - USE_MOCK_EMAIL=${USE_MOCK_EMAIL:-false}

      # AI Service (Hugging Face)
      - AI_SERVICE_URL=${AI_SERVICE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_SERVICE_TIMEOUT=${AI_SERVICE_TIMEOUT:-30}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
      
      # Application
      - APP_NAME=SkinAid Wound Detection API
      - VERSION=0.1.0
      - DEBUG=${DEBUG:-false}
      - UPLOAD_DIR=/app/uploads

      # CORS & URLs
      - CORS_ORIGINS=${CORS_ORIGINS}
      - BASE_URL=${BASE_URL}
      
      # Geoapify
      - GEOAPIFY_API_KEY=${GEOAPIFY_API_KEY}

    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database-postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - skinaid_net

  frontend:
    container_name: skinaid_frontend
    image: nguyentrunghieu123/skinaid-frontend:latest
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - skinaid_net

volumes:
  postgres_data:
  uploads_data:

networks:
  skinaid_net:
    driver: bridge
