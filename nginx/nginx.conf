# ================================================================
# nginx/nginx.conf — SkinAid Production Reverse Proxy
# ================================================================
# Kiến trúc:
#   Mobile App / Web Browser
#       ↓  HTTPS:443
#   nginx (điểm vào duy nhất)
#       ├── /api/v1/*  → backend:8000  (FastAPI)
#       ├── /uploads/* → backend:8000  (static files: scan images)
#       ├── /health    → backend:8000  (health check)
#       └── /*         → frontend:80   (React SPA)
#
# ⚠️  AI service (ai_ml:8001) là INTERNAL — không expose qua nginx
#     Backend gọi AI service trực tiếp qua Docker internal DNS
#
# Route thực tế của backend:
#   /api/v1/auth/**             - Authentication
#   /api/v1/users/**            - User Profile & Management
#   /api/v1/ai/**               - AI Processing (gọi ai_ml:8001 internally)
#   /api/v1/firstaid/**         - First Aid Knowledge
#   /api/v1/chatbot/**          - Chatbot (RAG + LLM)
#   /api/v1/rag/**              - Knowledge Retrieval
#   /api/v1/llm/**              - LLM Response Synthesis
#   /api/v1/map/**              - Map / Geoapify
#   /api/v1/notifications/**    - Notifications
#   /api/v1/questionnaires/**   - Questionnaires
#   /api/v1/dashboard/**        - Admin Dashboard Analytics
#   /api/v1/audit/**            - Audit Logs
#   /api/v1/guest/**            - Guest Access
#   /uploads/**                 - Static uploaded files
# ================================================================

# ── Rate limiting zones ─────────────────────────────────────────
# Giới hạn theo IP — tránh bot scan và brute force
# Zone "api": chung cho tất cả /api/ — 100 req/s per IP
# Zone "auth": strict hơn cho login/register — 10 req/s per IP
# Zone "ai": AI inference nặng — 5 req/s per IP
limit_req_zone $binary_remote_addr zone=api:10m   rate=100r/s;
limit_req_zone $binary_remote_addr zone=auth:10m  rate=10r/s;
limit_req_zone $binary_remote_addr zone=ai:10m    rate=5r/s;

# ── Upstream definitions ────────────────────────────────────────
upstream backend {
    server backend:8000;
    keepalive 32;  # connection pool — giảm TCP handshake overhead
}

upstream frontend {
    server frontend:80;
    keepalive 16;
}

# ── Shared proxy headers (dùng lại qua include) ─────────────────
# Được set trong map directive — apply trong location blocks bên dưới

# ================================================================
# Server Block 1: HTTP → HTTPS redirect
# ================================================================
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Health check endpoint cho AWS ALB / ELB (không redirect)
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Certbot ACME challenge (Let's Encrypt renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect tất cả còn lại sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ================================================================
# Server Block 2: HTTPS (Main)
# ================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ── SSL Configuration ──────────────────────────────────────
    # Certs từ Let's Encrypt (Certbot)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    # Chỉ dùng TLS 1.2 và 1.3 (loại bỏ TLS 1.0/1.1 cũ - PCI DSS compliant)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling — tăng tốc SSL handshake
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout    5s;

    # ── Security Headers ───────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # ── Gzip Compression ──────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml
        application/xml
        font/woff2;

    # ── Upload size — cho phép upload ảnh skin scan ────────────
    client_max_body_size 20M;
    client_body_timeout  30s;

    # ── Proxy shared settings ─────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Connection "";          # Enable keepalive với upstream
    proxy_set_header    Host $host;
    proxy_set_header    X-Real-IP $remote_addr;
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    X-Request-ID $request_id;  # Tracing
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;

    # ── CORS cho Mobile App ───────────────────────────────────
    # Mobile app (React Native) gọi từ domain khác / app scheme
    # Cấu hình CORS_ORIGINS thực sự nằm trong backend FastAPI
    # Nginx chỉ xử lý OPTIONS preflight nhanh (giảm latency)
    set $cors_origin "";
    if ($http_origin ~* "^https://(yourdomain\.com|app\.yourdomain\.com)$") {
        set $cors_origin $http_origin;
    }

    # ================================================================
    # Location: Authentication (strict rate limit — chống brute force)
    # /api/v1/auth/login, /api/v1/auth/register, /api/v1/auth/refresh
    # ================================================================
    location ~* ^/api/v1/auth/(login|register|forgot-password|reset-password) {
        # Strict: 10 req/s, burst 20, no delay
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;

        # OPTIONS preflight (mobile app CORS)
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, X-Session-ID" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://backend;
        proxy_read_timeout 30s;
    }

    # ================================================================
    # Location: AI Processing endpoints (heavy — long timeout + rate limit)
    # /api/v1/ai/* — backend sẽ gọi ai_ml:8001 internally
    # ================================================================
    location /api/v1/ai/ {
        # AI: 5 req/s per IP, burst 10 — inference nặng
        limit_req zone=ai burst=10 nodelay;
        limit_req_status 429;

        # OPTIONS preflight
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://backend;
        # AI inference có thể mất 15-60s (YOLO + EfficientNet)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ================================================================
    # Location: Chatbot / RAG / LLM (long timeout — LLM streaming)
    # /api/v1/chatbot/*, /api/v1/rag/*, /api/v1/llm/*
    # ================================================================
    location ~* ^/api/v1/(chatbot|rag|llm)/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://backend;
        # LLM response generation có thể lâu
        proxy_read_timeout 90s;
        # Disable buffering cho streaming response (nếu có)
        proxy_buffering off;
    }

    # ================================================================
    # Location: General API (tất cả /api/v1/ còn lại)
    # ================================================================
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_req_status 429;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key, X-Session-ID" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass         http://backend;
        proxy_read_timeout 60s;
    }

    # ================================================================
    # Location: Static uploaded files (scan images)
    # /uploads/* — served trực tiếp từ backend
    # ================================================================
    location /uploads/ {
        proxy_pass         http://backend;
        proxy_read_timeout 30s;

        # Cache ảnh upload tại nginx — giảm tải backend
        proxy_cache_valid  200 1d;
        add_header Cache-Control "public, max-age=86400, immutable";

        # Không cần rate limit cho static files
    }

    # ================================================================
    # Location: Backend health check (không log, không rate limit)
    # ================================================================
    location /health {
        access_log off;
        proxy_pass http://backend;
        proxy_read_timeout 5s;
    }

    # ================================================================
    # Location: API docs (Swagger / ReDoc) — chặn ngoài production
    # Comment out dòng return 404; để mở trong staging
    # ================================================================
    location ~* ^/(docs|redoc|openapi\.json) {
        # return 404;  # Uncomment để ẩn docs trên production

        proxy_pass http://backend;
    }

    # ================================================================
    # Location: Nginx health (cho AWS ALB / ECS health check)
    # ================================================================
    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ================================================================
    # Location: Frontend React SPA (catch-all)
    # Tất cả route khác → frontend container
    # ================================================================
    location / {
        proxy_pass http://frontend;
        proxy_read_timeout 30s;

        # Cache HTML ngắn (SPA thường dùng hashed filenames)
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        # SPA routing: nếu frontend nginx đã xử lý try_files rồi
        # thì không cần thêm ở đây
    }

    # ── Logging ───────────────────────────────────────────────
    access_log /var/log/nginx/skinaid_access.log;
    error_log  /var/log/nginx/skinaid_error.log warn;
}
