# ================================================================
# nginx/nginx.dev.conf — SkinAid LOCAL TESTING (No SSL)
# ================================================================
# Dùng để test Nginx routing trên máy local trước khi deploy
# Không có SSL, không có HSTS, rate limit lỏng hơn
#
# Dùng với docker-compose:
#   volumes:
#     - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
#
# Hoặc test standalone:
#   docker run -p 8080:80 \
#     -v $(pwd)/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro \
#     nginx:1.27-alpine
# ================================================================

# Rate limiting (lỏng hơn cho dev)
limit_req_zone $binary_remote_addr zone=api_dev:10m  rate=300r/s;
limit_req_zone $binary_remote_addr zone=ai_dev:10m   rate=30r/s;

upstream backend_dev {
    server backend:8000;
    keepalive 16;
}

upstream frontend_dev {
    server frontend:80;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost 127.0.0.1;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Upload ảnh
    client_max_body_size 20M;

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto http;

    # ── AI endpoints (long timeout) ─────────────────────────
    location /api/v1/ai/ {
        limit_req zone=ai_dev burst=30 nodelay;

        proxy_pass         http://backend_dev;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ── Chatbot / RAG / LLM ─────────────────────────────────
    location ~* ^/api/v1/(chatbot|rag|llm)/ {
        limit_req zone=api_dev burst=50 nodelay;

        proxy_pass         http://backend_dev;
        proxy_read_timeout 90s;
        proxy_buffering    off;
    }

    # ── General API ─────────────────────────────────────────
    location /api/ {
        limit_req zone=api_dev burst=100 nodelay;

        proxy_pass         http://backend_dev;
        proxy_read_timeout 60s;
    }

    # ── Static uploads ──────────────────────────────────────
    location /uploads/ {
        proxy_pass http://backend_dev;
    }

    # ── Health checks ───────────────────────────────────────
    location /health {
        access_log off;
        proxy_pass http://backend_dev;
        proxy_read_timeout 5s;
    }

    location /nginx-health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # ── API docs (mở trong dev) ──────────────────────────────
    location ~* ^/(docs|redoc|openapi\.json) {
        proxy_pass http://backend_dev;
    }

    # ── Frontend SPA (catch-all) ─────────────────────────────
    location / {
        proxy_pass http://frontend_dev;
    }

    # ── Logging (dev — verbose) ──────────────────────────────
    access_log /var/log/nginx/skinaid_dev_access.log;
    error_log  /var/log/nginx/skinaid_dev_error.log debug;
}
