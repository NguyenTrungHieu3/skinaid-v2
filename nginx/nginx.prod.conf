# ============================================================
# nginx/nginx.prod.conf — Production Reverse Proxy
# ============================================================
# Tất cả traffic vào qua nginx:
#   / → frontend container (static React app)
#   /api → backend container (FastAPI)
#   /uploads → backend container (static files)
# HTTP (80) redirect sang HTTPS (443)
# ============================================================

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name skinaid.xyz www.skinaid.xyz;

    # Health check endpoint cho load balancer (không redirect)
    location /nginx-health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skinaid.xyz www.skinaid.xyz;

    # SSL — certs từ Certbot/Let''s Encrypt
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1024;

    # Client body size (upload ảnh)
    client_max_body_size 10M;

    # ── Frontend (React SPA) ──────────────────────────
    location / {
        proxy_pass         http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Backend API ───────────────────────────────────
    location /api {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ── Backend static files (uploads/images) ─────────
    location /uploads {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        # Cache ảnh upload
        proxy_cache_valid  200 1d;
        add_header         Cache-Control "public, max-age=86400";
    }

    # ── API docs (chặn ngoài production nếu cần) ──────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend:8000;
        # Uncomment dòng dưới nếu muốn chặn docs trên production:
        # return 404;
    }

    # Health check
    location /nginx-health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
