# ============================================================
# docker-compose.prod.yml — SkinAid PRODUCTION (AWS EC2)
# ============================================================
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Target: AWS EC2 t3.medium (2 vCPU, 4 GB RAM)
# Điều chỉnh mem_limit / cpus phù hợp spec EC2 thực tế.
#
# ⚠️  Redis + Qdrant KHÔNG expose port ra host
# ⚠️  Chỉ nginx expose 80 (HTTPS terminate tại load balancer hoặc Certbot)
# ⚠️  Tất cả services dùng restart: always
# ============================================================

services:

  # ──────────────────────────────────────────────────────
  # PostgreSQL
  # ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: skinaid_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # KHÔNG expose port — chỉ backend mới kết nối
    networks:
      - skinaid_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ──────────────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: skinaid_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    # KHÔNG expose port
    networks:
      - skinaid_internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # ──────────────────────────────────────────────────────
  # Qdrant (Vector DB)
  # ──────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: skinaid_qdrant
    restart: always
    volumes:
      - qdrant_data:/qdrant/storage
    # KHÔNG expose port
    networks:
      - skinaid_internal
    healthcheck:
      # Qdrant image không có curl/wget — dùng /proc/net/tcp để check port 6333
      # Port 6333 hex = 18BD
      test: ["CMD-SHELL", "grep -q '18BD' /proc/net/tcp || grep -q '18BD' /proc/net/tcp6 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # ──────────────────────────────────────────────────────
  # AI Service
  # ──────────────────────────────────────────────────────
  ai_ml:
    build:
      context: ./ai_ml
      dockerfile: Dockerfile
    image: skinaid-ai:latest
    container_name: skinaid_ai
    restart: always
    env_file:
      - ./ai_ml/.env.prod
    volumes:
      - ai_model_weights:/app/models   # model weights persist qua deploy
    # KHÔNG expose port — backend gọi qua internal network
    networks:
      - skinaid_internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 30s
      timeout: 15s
      start_period: 90s    # torch load chậm
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G       # torch cần nhiều RAM
          cpus: "1.0"

  # ──────────────────────────────────────────────────────
  # Backend Service
  # ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: skinaid-backend:latest
    container_name: skinaid_backend
    restart: always
    env_file:
      - ./backend/.env.prod
    environment:
      DATABASE_URL: "postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}"
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      QDRANT: "http://qdrant:6333/"
      AI_SERVICE_URL: "http://ai_ml:8001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_rag_docs:/app/rag_docs
      - backend_logs:/app/logs
    # KHÔNG expose port — nginx proxy qua internal network
    networks:
      - skinaid_internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started   # qdrant image ko có curl/wget để health check
      ai_ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.75"

  # ──────────────────────────────────────────────────────
  # Frontend (nginx serve static + reverse proxy API)
  # ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL}
    image: skinaid-frontend:latest
    container_name: skinaid_frontend
    restart: always
    networks:
      - skinaid_internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # ──────────────────────────────────────────────────────
  # Nginx — Reverse Proxy (điểm vào duy nhất từ Internet)
  # ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: skinaid_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx_logs:/var/log/nginx
    networks:
      - skinaid_internal
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"

# ──────────────────────────────────────────────────────
# Networks — internal only (không map ra host)
# ──────────────────────────────────────────────────────
networks:
  skinaid_internal:
    driver: bridge
    internal: false    # nginx cần ra Internet (DNS resolve, v.v.)

# ──────────────────────────────────────────────────────
# Volumes — persist data qua container restart/update
# ──────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ai_model_weights:
  backend_rag_docs:
  backend_uploads:
  backend_logs:
  nginx_logs:
