server {
    listen 80;
    listen  [::]:80;
    server_name localhost;

    #access_log  /var/log/nginx/host.access.log  main;

    # Thư mục chứa file tĩnh
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cấu hình cache cho các tài nguyên tĩnh
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|json)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        root /usr/share/nginx/html;
    }

    # (Tùy chọn) Chuyển tiếp (proxy) các request API
    # Nếu bạn muốn frontend gọi /api/v1 -> backend:8000/api/v1
    location /api {
        proxy_pass http://skinaid_backend:8000; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}