name: Deploy to AWS EC2

on:
  push:
    branches:
      - deploypment

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 600s
          script: |
            set -e

            echo "=== Pull code mới ==="
            cd ~/skinaid
            git stash || true
            git pull origin deploypment

            echo "=== Ghi file .env.prod ==="
            cat > .env.prod << 'EOF'
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=5432
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DATABASE_URL=postgresql+asyncpg://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@${{ secrets.DB_HOST }}:5432/${{ secrets.DB_NAME }}

            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ALGORITHM=HS256
            ACCESS_TOKEN_EXPIRE_MINUTES=30
            REFRESH_TOKEN_EXPIRE_DAYS=7

            APP_NAME=SkinAid Wound Detection API
            VERSION=0.1.0
            DEBUG=false
            TESTING=false
            API_V1_STR=/api/v1
            UPLOAD_DIR=/app/uploads

            CORS_ORIGINS=${{ secrets.CORS_ORIGINS }}
            BASE_URL=${{ secrets.BASE_URL }}

            USE_MOCK_EMAIL=false
            SMTP_SERVER=${{ secrets.SMTP_SERVER }}
            SMTP_PORT=587
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}

            MAX_UPLOAD_SIZE=5242880
            MIN_FILE_SIZE=1024
            ALLOWED_EXTENSIONS=.jpg,.jpeg,.png
            MAX_IMAGE_WIDTH=4096
            MAX_IMAGE_HEIGHT=4096
            MIN_IMAGE_WIDTH=100
            MIN_IMAGE_HEIGHT=100

            AI_SERVICE_URL=http://ai:8001
            AI_SECRET_KEY=${{ secrets.AI_SECRET_KEY }}
            AI_SERVICE_TIMEOUT=60
            AI_MAX_RETRIES=3
            S3_BUCKET=${{ secrets.S3_BUCKET }}

            REDIS_URL=redis://redis:6379/0

            QDRANT=http://qdrant:6333/
            RAG_COLLECTION_NAME=skinaid_knowledge_base
            RAG_EMBEDDING_DIMENSION=3072
            RAG_DOCS_PATH=docs/RAGDocumentation
            RAG_SCORE_THRESHOLD=0.5
            RAG_SPARSE_MODEL=Qdrant/bm25

            OPEN_API_KEY=${{ secrets.OPEN_API_KEY }}
            OPEN_EMBEDDING_MODEL=text-embedding-3-small

            GEOAPIFY_API_KEY=${{ secrets.GEOAPIFY_API_KEY }}
            EOF

            echo "=== 🐳 Build và khởi động containers ==="
            docker compose -f docker-compose.prod.yml --env-file .env.prod down || true
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --remove-orphans

            echo "=== ⏳ Chờ backend sẵn sàng ==="
            timeout 120 bash -c 'until docker exec skinaid_backend curl -f http://localhost:8000/health 2>/dev/null; do sleep 2; done' || echo "⚠️ Health check timeout, tiếp tục..."

            echo "=== 🧹 Dọn dẹp images cũ ==="
            docker image prune -af

            echo "=== ✅ Deploy hoàn tất! ==="
            docker compose -f docker-compose.prod.yml ps

            echo "=== 📊 Disk usage ==="
            df -h / | grep -E '^Filesystem|/$'