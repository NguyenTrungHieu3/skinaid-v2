# EfficientNet Classification Configuration
model:
  name: "efficientnet_b3"
  type: "classification"
  weights_path: "../classification/models/final_model_v2.pth"
  num_classes: 12
  pretrained: false

classes:
  - "abrasion_mild"
  - "abrasion_moderate"
  - "acne_mild"
  - "acne_moderate"
  - "acne_severe"
  - "bruise_mild"
  - "bruise_moderate"
  - "burn_mild"
  - "burn_moderate_blister"
  - "burn_moderate_skintear"
  - "psoriasis"
  - "ringworm"

inference:
  device: "cpu"  # or "cuda" for GPU
  batch_size: 1
  
image:
  size: 224
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  
output:
  save_results: true
  save_dir: "../outputs/efficientnet_classification"
  return_confidence: true
